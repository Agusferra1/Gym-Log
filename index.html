<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Gym Log</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0A0A0B">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gym Log">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0A0B; --surface:#131316; --surface2:#1A1A1F; --line:#26262D;
    --dim:#33333C; --muted:#6B6B78; --text:#F5F5F4;
    --accent:#C8FF00; --accent-dim:#4A5C00; --warn:#FF5A5A;
    --safe-b:env(safe-area-inset-bottom,0px);
    --safe-t:env(safe-area-inset-top,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:'Inter',system-ui,sans-serif;overscroll-behavior-y:none}
  body{padding-bottom:calc(96px + var(--safe-b))}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input{font-family:'DM Mono',monospace}
  .wrap{max-width:520px;margin:0 auto}
  .mono{font-family:'DM Mono',monospace}
  .display{font-family:'Bebas Neue',sans-serif;letter-spacing:.08em}

  /* ── HEADER ── */
  header{position:sticky;top:0;z-index:40;background:#0D0D0F;
    border-bottom:1px solid var(--line);padding-top:var(--safe-t)}
  .hrow{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px}
  .logo{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:.18em}
  .hright{display:flex;align-items:center;gap:10px}
  .status{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.1em;color:var(--dim)}
  .status.ok{color:var(--accent-dim)}
  .status.err{color:var(--warn)}
  .iconbtn{width:34px;height:34px;border:1px solid var(--dim);border-radius:9px;
    display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--muted)}
  .iconbtn:active{background:var(--surface2)}

  .cyclebar{display:flex;align-items:center;justify-content:space-between;padding:0 16px 12px}
  .cyclenum{text-align:center;line-height:1}
  .cyclenum b{font-family:'Bebas Neue',sans-serif;font-size:19px;letter-spacing:.16em;color:var(--accent)}
  .cyclenum span{display:block;font-family:'DM Mono',monospace;font-size:8.5px;
    letter-spacing:.08em;color:var(--dim);margin-top:3px}

  .tabs{display:flex;gap:6px;padding:0 12px}
  .tab{flex:1;padding:11px 4px 9px;border:1px solid var(--line);
    border-bottom:2px solid var(--line);border-radius:11px 11px 0 0;
    font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.06em;color:var(--dim);
    transition:all .15s}
  .tab .lbl{font-size:12px;font-weight:500}
  .tab .st{font-size:8px;margin-top:3px;height:10px;line-height:10px}
  .tab.has{color:var(--muted);border-color:#1F2600}
  .tab.done{color:var(--accent-dim);border-color:#243000;background:rgba(200,255,0,.02)}
  .tab.sel{color:var(--accent);border-color:var(--accent);border-bottom-color:var(--accent);
    background:rgba(200,255,0,.06)}

  /* ── DAY HEAD ── */
  .dayhead{padding:20px 16px 16px;border-bottom:1px solid var(--line)}
  .dayhead h1{font-family:'Bebas Neue',sans-serif;font-size:34px;letter-spacing:.05em;
    margin:0;line-height:1}
  .dayhead p{font-family:'DM Mono',monospace;font-size:10.5px;color:var(--muted);
    margin:6px 0 0;letter-spacing:.04em}
  .chip{display:inline-block;margin-top:11px;padding:5px 11px;border-radius:20px;
    font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.06em;
    background:rgba(200,255,0,.06);border:1px solid rgba(200,255,0,.14);color:var(--accent)}
  .chip.grey{background:var(--surface2);border-color:var(--line);color:var(--muted)}

  /* ── PROGRESS ── */
  .prog{padding:14px 16px 4px}
  .progbar{height:3px;background:var(--surface2);border-radius:3px;overflow:hidden}
  .progfill{height:100%;background:var(--accent);width:0;transition:width .3s ease}
  .proglbl{display:flex;justify-content:space-between;margin-top:7px;
    font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.06em;color:var(--dim)}

  /* ── EXERCISE CARD ── */
  .list{padding:10px 12px 0}
  .card{background:var(--surface);border:1px solid var(--dim);border-radius:13px;
    margin-bottom:9px;overflow:hidden}
  .card.open{border-color:var(--line)}
  .card.full{border-color:rgba(200,255,0,.22)}
  .chead{width:100%;display:flex;align-items:center;justify-content:space-between;
    padding:14px 15px;text-align:left;gap:10px}
  .cname{font-size:13.5px;font-weight:600;color:#7A7A85;line-height:1.3}
  .card.touched .cname,.card.full .cname{color:var(--text)}
  .cmeta{font-family:'DM Mono',monospace;font-size:9.5px;color:var(--dim);
    margin-top:4px;letter-spacing:.05em}
  .cright{display:flex;align-items:center;gap:9px;flex-shrink:0}
  .dot{font-family:'DM Mono',monospace;font-size:10px;color:var(--accent)}
  .sug-i{font-size:11px;font-weight:700}
  .sug-i.up{color:var(--accent)} .sug-i.eq{color:var(--muted)} .sug-i.dn{color:#8A7A3A}
  .plus{color:var(--dim);font-size:17px;line-height:1;width:14px;text-align:center}

  .cbody{padding:0 13px 14px;border-top:1px solid var(--line)}
  .hint{margin:12px 0 0;font-family:'DM Mono',monospace;font-size:9.5px;
    color:#4E4E58;letter-spacing:.03em;font-style:italic}
  .sugbox{margin:11px 0 13px;padding:9px 12px;border-radius:9px;
    font-family:'DM Mono',monospace;font-size:10.5px;letter-spacing:.03em;line-height:1.4}
  .sugbox.up{background:rgba(200,255,0,.07);border:1px solid rgba(200,255,0,.2);color:var(--accent)}
  .sugbox.eq{background:rgba(255,255,255,.03);border:1px solid var(--line);color:#7A7A85}
  .sugbox.dn{background:rgba(255,255,255,.03);border:1px solid var(--line);color:#8A7A3A}
  .sugbox.none{background:rgba(255,255,255,.02);border:1px solid var(--line);color:#42424C}

  .colhead{display:flex;gap:7px;padding:0 3px;margin-bottom:7px;
    font-family:'DM Mono',monospace;font-size:8.5px;letter-spacing:.08em;color:#2E2E36}
  .colhead .c1{width:26px} .colhead .c2,.colhead .c3{flex:1;text-align:center}
  .colhead .c4{width:40px}

  .srow{display:flex;gap:7px;align-items:center;margin-bottom:6px;
    padding:7px 5px;border-radius:9px;background:var(--surface2)}
  .srow:nth-child(even){background:rgba(255,255,255,.012)}
  .srow.done{background:rgba(200,255,0,.045)}
  .snum{width:26px;text-align:center;font-family:'DM Mono',monospace;
    font-size:11px;color:#3E3E48;font-weight:500}
  .srow.done .snum{color:var(--accent-dim)}
  .field{flex:1;display:flex;align-items:center;gap:3px;justify-content:center}
  .stepbtn{width:30px;height:34px;border-radius:8px;border:1px solid var(--dim);
    color:var(--muted);font-size:17px;display:flex;align-items:center;justify-content:center}
  .stepbtn:active{background:var(--dim);color:var(--text)}
  .numin{width:54px;height:34px;background:transparent;border:1px solid transparent;
    border-radius:7px;color:#3A3A44;font-size:15px;font-weight:500;text-align:center;
    outline:none;padding:0}
  .numin.set{color:var(--text)}
  .numin:focus{border-color:var(--accent);background:rgba(200,255,0,.05)}
  .numin.low{color:#C88A3A}
  .checkbtn{width:40px;height:34px;border-radius:8px;border:1px solid var(--dim);
    display:flex;align-items:center;justify-content:center;font-size:13px;color:#33333C}
  .checkbtn.on{background:var(--accent);border-color:var(--accent);color:#0A0A0B;font-weight:700}

  .rowtools{display:flex;gap:7px;margin-top:9px;flex-wrap:wrap}
  .tool{border:1px solid var(--line);border-radius:20px;padding:6px 12px;
    font-family:'DM Mono',monospace;font-size:9.5px;letter-spacing:.05em;color:var(--muted)}
  .tool:active{background:var(--surface2);color:var(--text)}
  .tool.link{color:#5B8FD6;border-color:#1E2A3A}

  /* ── FOOTER ── */
  footer{position:fixed;bottom:0;left:0;right:0;z-index:40;
    padding:10px 12px calc(14px + var(--safe-b));
    background:linear-gradient(0deg,var(--bg) 62%,transparent)}
  .footin{max-width:520px;margin:0 auto}
  .bigbtn{width:100%;padding:16px;border-radius:13px;background:var(--accent);color:#0A0A0B;
    font-family:'Bebas Neue',sans-serif;font-size:19px;letter-spacing:.18em}
  .bigbtn.done{background:#1B2400;color:var(--accent);border:1px solid rgba(200,255,0,.3)}
  .bigbtn:active{transform:scale(.985)}
  .foothint{text-align:center;margin-top:7px;font-family:'DM Mono',monospace;
    font-size:8.5px;letter-spacing:.06em;color:#2C2C34}
  .foothint.err{color:var(--warn)}

  /* ── REST TIMER ── */
  .timer{position:fixed;left:0;right:0;bottom:calc(88px + var(--safe-b));z-index:45;
    padding:0 12px;pointer-events:none}
  .timerin{max-width:520px;margin:0 auto;background:#161A08;
    border:1px solid rgba(200,255,0,.28);border-radius:13px;
    padding:11px 14px;display:flex;align-items:center;gap:12px;pointer-events:auto;
    box-shadow:0 8px 32px rgba(0,0,0,.6)}
  .tlabel{font-family:'DM Mono',monospace;font-size:8.5px;letter-spacing:.12em;color:var(--accent-dim)}
  .tclock{font-family:'Bebas Neue',sans-serif;font-size:30px;letter-spacing:.06em;
    color:var(--accent);line-height:1;margin-top:2px}
  .tclock.over{color:var(--warn)}
  .tbtns{margin-left:auto;display:flex;gap:6px}
  .tbtn{padding:8px 12px;border-radius:8px;border:1px solid rgba(200,255,0,.25);
    font-family:'DM Mono',monospace;font-size:10px;color:var(--accent);letter-spacing:.05em}
  .tbtn:active{background:rgba(200,255,0,.12)}

  /* ── SHEET / MODAL ── */
  .backdrop{position:fixed;inset:0;background:rgba(0,0,0,.86);z-index:60;
    display:flex;align-items:flex-end;justify-content:center;padding:0}
  .sheet{width:100%;max-width:520px;background:var(--surface);
    border:1px solid var(--line);border-radius:18px 18px 0 0;
    padding:20px 18px calc(22px + var(--safe-b));max-height:88vh;overflow-y:auto}
  .sheet h2{font-family:'Bebas Neue',sans-serif;font-size:23px;letter-spacing:.1em;
    margin:0 0 5px}
  .sheet p{font-family:'DM Mono',monospace;font-size:10.5px;color:var(--muted);
    line-height:1.65;margin:0 0 16px}
  .sbtn{width:100%;padding:13px;border-radius:10px;margin-bottom:9px;
    font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.08em;
    border:1px solid var(--dim);color:var(--text);text-align:center}
  .sbtn:active{background:var(--surface2)}
  .sbtn.primary{background:var(--accent);color:#0A0A0B;border-color:var(--accent);font-weight:500}
  .sbtn.danger{color:var(--warn);border-color:#3A1A1A}
  textarea{width:100%;height:90px;background:var(--bg);border:1px solid var(--line);
    color:var(--text);padding:11px;border-radius:9px;font-size:10px;
    font-family:'DM Mono',monospace;resize:vertical;outline:none;margin-bottom:9px}
  textarea:focus{border-color:var(--accent)}
  .lbl{font-family:'DM Mono',monospace;font-size:9px;color:#44444E;
    letter-spacing:.08em;margin:16px 0 7px}
  .notesin{width:100%;height:70px;background:var(--bg);border:1px solid var(--line);
    color:var(--text);padding:11px;border-radius:9px;font-size:11px;
    font-family:'Inter',sans-serif;resize:vertical;outline:none}
  .notesin:focus{border-color:var(--accent)}

  /* ── TOAST ── */
  .toast{position:fixed;left:50%;transform:translateX(-50%);z-index:80;
    top:calc(14px + var(--safe-t));background:var(--accent);color:#0A0A0B;
    padding:10px 20px;border-radius:22px;font-family:'DM Mono',monospace;
    font-size:11px;letter-spacing:.05em;white-space:nowrap;
    box-shadow:0 4px 26px rgba(200,255,0,.32);font-weight:500}
  .toast.err{background:var(--warn);color:#fff;box-shadow:0 4px 26px rgba(255,90,90,.3)}

  .banner{background:var(--warn);color:#140000;padding:10px 14px;
    display:flex;align-items:center;justify-content:space-between;gap:10px}
  .banner b{font-family:'DM Mono',monospace;font-size:10.5px;letter-spacing:.05em;display:block}
  .banner span{font-family:'DM Mono',monospace;font-size:8.5px;opacity:.75}
  .banner button{background:#140000;color:var(--warn);padding:7px 12px;border-radius:7px;
    font-family:'DM Mono',monospace;font-size:9.5px;letter-spacing:.05em;font-weight:600}

  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app" class="wrap"></div>

<script>
/* ═══════════════════ PLAN: 3 días · full body ═══════════════════ */
const PLAN=[
 {k:"A",name:"DÍA A",sub:"Full body · énfasis empuje",
  ex:[
   {id:"a1",n:"Press banca con barra",s:3,lo:8,hi:10,eq:"side",v:"press banca con barra tecnica correcta"},
   {id:"a2",n:"Remo con mancuerna un brazo",s:3,lo:10,hi:12,eq:"db",v:"remo con mancuerna un brazo tecnica"},
   {id:"a3",n:"Sentadilla goblet",s:3,lo:10,hi:12,eq:"db",v:"sentadilla goblet tecnica"},
   {id:"a4",n:"Press militar mancuernas",s:3,lo:10,hi:12,eq:"db",v:"press militar con mancuernas sentado"},
   {id:"a5",n:"Extensión tríceps en polea",s:3,lo:12,hi:15,eq:"stack",v:"extension triceps polea cuerda"},
   {id:"a6",n:"Curl bíceps con barra",s:3,lo:10,hi:12,eq:"side",v:"curl de biceps con barra"},
   {id:"a7",n:"Plancha frontal",s:3,lo:45,hi:45,eq:"bw",t:1,v:"plancha frontal abdomen tecnica"}
  ]},
 {k:"B",name:"DÍA B",sub:"Full body · énfasis tirón",
  ex:[
   {id:"b1",n:"Peso muerto rumano (RDL)",s:3,lo:10,hi:12,eq:"side",v:"peso muerto rumano RDL tecnica"},
   {id:"b2",n:"Jalón al pecho",s:3,lo:10,hi:12,eq:"stack",v:"jalon al pecho agarre ancho tecnica"},
   {id:"b3",n:"Press inclinado mancuernas",s:3,lo:10,hi:12,eq:"db",v:"press inclinado con mancuernas"},
   {id:"b4",n:"Prensa de piernas",s:3,lo:12,hi:15,eq:"side",v:"prensa de piernas 45 grados"},
   {id:"b5",n:"Elevaciones laterales",s:3,lo:12,hi:15,eq:"db",v:"elevaciones laterales con mancuernas"},
   {id:"b6",n:"Curl martillo",s:3,lo:10,hi:12,eq:"db",v:"curl martillo con mancuernas"},
   {id:"b7",n:"Elevación de piernas colgado",s:3,lo:10,hi:15,eq:"bw",v:"elevacion de piernas colgado"}
  ]},
 {k:"C",name:"DÍA C",sub:"Full body · énfasis piernas",
  ex:[
   {id:"c1",n:"Sentadilla libre",s:3,lo:8,hi:10,eq:"side",v:"sentadilla libre con barra tecnica"},
   {id:"c2",n:"Remo en polea baja",s:3,lo:10,hi:12,eq:"stack",v:"remo en polea baja sentado"},
   {id:"c3",n:"Fondos en paralelas",s:3,lo:8,hi:12,eq:"bw",v:"fondos en paralelas dips tecnica"},
   {id:"c4",n:"Curl femoral acostado",s:3,lo:12,hi:15,eq:"stack",v:"curl femoral acostado maquina"},
   {id:"c5",n:"Face pull con cuerda",s:3,lo:15,hi:20,eq:"stack",v:"face pull con cuerda polea"},
   {id:"c6",n:"Curl concentrado",s:3,lo:10,hi:12,eq:"db",v:"curl concentrado con mancuerna"},
   {id:"c7",n:"Rueda abdominal",s:3,lo:10,hi:15,eq:"bw",v:"rueda abdominal ab wheel"}
  ]}
];

const EQ={
 side :{lbl:"KG / LADO",  hint:"Anotá el peso de UN lado de la barra"},
 db   :{lbl:"KG / MANC.", hint:"Anotá el peso de UNA mancuerna"},
 stack:{lbl:"KG",         hint:"Anotá el peso que marca el stack"},
 bw   :{lbl:"KG EXTRA",   hint:"0 si es solo tu peso corporal"}
};

const KEY="gymlog.v3";
const REST=90; // segundos

/* ═══════════════════ ESTADO ═══════════════════ */
let S={cycle:1,day:0,data:{},notes:{}};
let openEx=null, saveState="ok", toastT=null;
let timer={on:false,left:0,id:null};

function blank(ex){return Array.from({length:ex.s},()=>({w:"",r:"",d:false}));}
function sk(c,d){return "c"+c+"d"+PLAN[d].k;}

function load(){
  try{
    const raw=localStorage.getItem(KEY);
    if(raw){const p=JSON.parse(raw);
      S.cycle=p.cycle||1; S.data=p.data||{}; S.notes=p.notes||{};}
    saveState="ok";
  }catch(e){ saveState="err"; console.error(e); }
}
function save(){
  try{
    localStorage.setItem(KEY,JSON.stringify({cycle:S.cycle,data:S.data,notes:S.notes,v:3}));
    if(saveState==="err"){saveState="ok";render();}
    saveState="ok";
  }catch(e){ saveState="err"; console.error(e); render(); }
}
function sess(c,d){
  const k=sk(c,d);
  if(!S.data[k]) S.data[k]={ex:{},done:false};
  return S.data[k];
}
function sets(c,d,ex){
  const s=sess(c,d);
  if(!s.ex[ex.id]) s.ex[ex.id]=blank(ex);
  if(s.ex[ex.id].length!==ex.s) s.ex[ex.id]=blank(ex);
  return s.ex[ex.id];
}

/* ═══════════════════ SUGERENCIA ═══════════════════ */
function suggest(ex,si){
  if(S.cycle<2) return null;
  const prev=S.data[sk(S.cycle-1,S.day)];
  if(!prev||!prev.ex[ex.id]) return null;
  const p=prev.ex[ex.id][si];
  if(!p||p.r===""||p.r===null) return null;
  const w=parseFloat(p.w)||0, r=parseInt(p.r)||0;
  if(r>=ex.hi) return {t:"up", w:w+2.5, txt:"Subí a "+fmt(w+2.5)+" kg — llegaste al tope"};
  if(r>=ex.lo) return {t:"eq", w:w,     txt:"Mantené "+fmt(w)+" kg — sumá reps"};
  return              {t:"dn", w:w,     txt:"Mantené "+fmt(w)+" kg — recuperá el rango"};
}
function exSuggest(ex){
  const all=[]; for(let i=0;i<ex.s;i++){const s=suggest(ex,i); if(s) all.push(s);}
  if(!all.length) return null;
  if(all.some(s=>s.t==="up")) return "up";
  if(all.every(s=>s.t==="dn")) return "dn";
  return "eq";
}
function fmt(n){return (Math.round(n*10)/10).toString().replace(/\.0$/,"");}

/* ═══════════════════ TIMER ═══════════════════ */
function startTimer(){
  clearInterval(timer.id);
  timer.on=true; timer.left=REST;
  timer.id=setInterval(()=>{
    timer.left--;
    if(timer.left===0 && navigator.vibrate) navigator.vibrate([180,90,180]);
    if(timer.left<=-30) stopTimer(); else paintTimer();
  },1000);
  render();
}
function stopTimer(){clearInterval(timer.id);timer.on=false;render();}
function addTimer(s){timer.left+=s;paintTimer();}
function paintTimer(){
  const el=document.getElementById("tclock"); if(!el)return;
  const neg=timer.left<0, v=Math.abs(timer.left);
  el.textContent=(neg?"+":"")+Math.floor(v/60)+":"+String(v%60).padStart(2,"0");
  el.className="tclock"+(neg?" over":"");
}

/* ═══════════════════ ACCIONES ═══════════════════ */
function setVal(ex,si,f,v){
  const arr=sets(S.cycle,S.day,ex);
  arr[si][f]=v; save();
}
function toggleDone(ex,si){
  const arr=sets(S.cycle,S.day,ex);
  const was=arr[si].d;
  arr[si].d=!was;
  if(!was){
    if(arr[si].r==="") arr[si].r=ex.lo;
    if(arr[si].w===""&&ex.eq!=="bw"){
      const s=suggest(ex,si); if(s) arr[si].w=fmt(s.w);
    }
  }
  save();
  if(!was) startTimer(); else render();
}
function copyDown(ex){
  const arr=sets(S.cycle,S.day,ex);
  const w=arr[0].w;
  arr.forEach(s=>s.w=w);
  save(); render();
}
function markSession(){
  const s=sess(S.cycle,S.day);
  s.done=!s.done; save(); render();
  toast(s.done?"Sesión cerrada":"Sesión reabierta");
}
function exportData(){
  const txt=JSON.stringify({cycle:S.cycle,data:S.data,notes:S.notes,v:3,exp:new Date().toISOString()});
  navigator.clipboard.writeText(txt)
    .then(()=>toast("Copiado — pegalo en una nota"))
    .catch(()=>{
      const ta=document.getElementById("expbox");
      if(ta){ta.value=txt;ta.select();toast("Copialo manualmente");}
    });
}
function importData(){
  const ta=document.getElementById("impbox");
  if(!ta||!ta.value.trim()){toast("Pegá los datos primero",true);return;}
  try{
    const p=JSON.parse(ta.value);
    if(!p.data) throw new Error("formato");
    S.cycle=p.cycle||1; S.data=p.data; S.notes=p.notes||{};
    save(); closeSheet(); render(); toast("Datos importados");
  }catch(e){toast("El texto no es válido",true);}
}
function toast(msg,err){
  clearTimeout(toastT);
  let t=document.getElementById("toast");
  if(!t){t=document.createElement("div");t.id="toast";document.body.appendChild(t);}
  t.className="toast"+(err?" err":""); t.textContent=msg;
  toastT=setTimeout(()=>t.remove(),2100);
}

/* ═══════════════════ SHEET ═══════════════════ */
let sheet=null;
function openSheet(k){sheet=k;render();}
function closeSheet(){
  if(sheet==="notes"){
    const n=document.getElementById("notesbox");
    if(n){S.notes[sk(S.cycle,S.day)]=n.value;save();}
  }
  sheet=null;render();
}

/* ═══════════════════ RENDER ═══════════════════ */
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

function render(){
  const day=PLAN[S.day], s=sess(S.cycle,S.day);
  let total=0,filled=0;
  day.ex.forEach(ex=>{const a=sets(S.cycle,S.day,ex);total+=ex.s;a.forEach(x=>{if(x.d)filled++;});});
  const pct=total?Math.round(filled/total*100):0;

  let h="";

  /* banner de error */
  if(saveState==="err"){
    h+=`<div class="banner">
      <div><b>No se puede guardar</b><span>revisá el modo incógnito o el espacio del navegador</span></div>
      <button onclick="save();render()">Reintentar</button></div>`;
  }

  /* header */
  h+=`<header>
    <div class="hrow">
      <div class="logo">GYM LOG</div>
      <div class="hright">
        <span class="status ${saveState==="err"?"err":"ok"}">${saveState==="err"?"● SIN GUARDAR":"✓ GUARDADO"}</span>
        <button class="iconbtn" onclick="openSheet('menu')">⋯</button>
      </div>
    </div>
    <div class="cyclebar">
      <button class="iconbtn" onclick="if(S.cycle>1){S.cycle--;openEx=null;save();render()}">←</button>
      <div class="cyclenum"><b>CICLO ${S.cycle}</b><span>3 SESIONES POR CICLO</span></div>
      <button class="iconbtn" onclick="S.cycle++;openEx=null;save();render()">→</button>
    </div>
    <div class="tabs">`;
  PLAN.forEach((d,i)=>{
    const ds=S.data[sk(S.cycle,i)];
    const done=ds&&ds.done;
    const has=ds&&Object.values(ds.ex||{}).some(a=>a.some(x=>x.d));
    const cls=(S.day===i?"sel ":"")+(done?"done":has?"has":"");
    h+=`<button class="tab ${cls}" onclick="S.day=${i};openEx=null;render()">
      <div class="lbl">${d.k}</div>
      <div class="st">${done?"✓":has?"•":"&nbsp;"}</div></button>`;
  });
  h+=`</div></header>`;

  /* day head */
  h+=`<div class="dayhead">
    <h1>${day.name}</h1>
    <p>${esc(day.sub)}</p>
    ${s.done?`<span class="chip">✓ SESIÓN CERRADA</span>`:
      S.cycle>1?`<span class="chip">CICLO ${S.cycle-1} REGISTRADO · SUGERENCIAS ACTIVAS</span>`:
      `<span class="chip grey">PRIMER CICLO · ESTÁS FIJANDO TU BASE</span>`}
  </div>`;

  /* progress */
  h+=`<div class="prog">
    <div class="progbar"><div class="progfill" style="width:${pct}%"></div></div>
    <div class="proglbl"><span>${filled} DE ${total} SERIES</span><span>${pct}%</span></div>
  </div>`;

  /* exercises */
  h+=`<div class="list">`;
  day.ex.forEach(ex=>{
    const arr=sets(S.cycle,S.day,ex);
    const nd=arr.filter(x=>x.d).length;
    const isOpen=openEx===ex.id;
    const eq=EQ[ex.eq];
    const si=exSuggest(ex);
    const unit=ex.t?"seg":"reps";
    const range=ex.lo===ex.hi?`${ex.s}×${ex.lo} ${unit}`:`${ex.s}×${ex.lo}–${ex.hi} ${unit}`;
    const cls=(isOpen?"open ":"")+(nd===ex.s?"full ":nd>0?"touched ":"");

    h+=`<div class="card ${cls}">
      <button class="chead" onclick="openEx=${isOpen?"null":"'"+ex.id+"'"};render()">
        <div style="flex:1;min-width:0">
          <div class="cname">${esc(ex.n)}</div>
          <div class="cmeta">${range} · ${ex.t?"PESO CORPORAL":eq.lbl}</div>
        </div>
        <div class="cright">
          ${nd>0?`<span class="dot">${nd}/${ex.s}</span>`:""}
          ${si&&nd===0?`<span class="sug-i ${si}">${si==="up"?"↑":si==="dn"?"↺":"="}</span>`:""}
          <span class="plus">${isOpen?"−":"+"}</span>
        </div>
      </button>`;

    if(isOpen){
      h+=`<div class="cbody">`;
      if(ex.eq!=="bw"||ex.t) h+=`<div class="hint">↳ ${eq.hint}</div>`;

      const s0=suggest(ex,0);
      if(s0) h+=`<div class="sugbox ${s0.t}">${s0.t==="up"?"↑":s0.t==="dn"?"↺":"="} ${esc(s0.txt)}</div>`;
      else h+=`<div class="sugbox none">Sin datos del ciclo anterior — anotá tu referencia</div>`;

      h+=`<div class="colhead">
        <span class="c1">SET</span>
        <span class="c2">${ex.t?"—":eq.lbl}</span>
        <span class="c3">${unit.toUpperCase()}</span>
        <span class="c4"></span></div>`;

      arr.forEach((st,i)=>{
        const rv=parseInt(st.r)||0;
        const low=rv>0&&rv<ex.lo;
        h+=`<div class="srow ${st.d?"done":""}">
          <span class="snum">${i+1}</span>
          <div class="field">`;
        if(ex.t){h+=`<span style="font-family:'DM Mono',monospace;font-size:12px;color:#2C2C34">—</span>`;}
        else{
          h+=`<button class="stepbtn" onclick="stepW('${ex.id}',${i},-2.5)">−</button>
              <input class="numin ${st.w!==""?"set":""}" inputmode="decimal" placeholder="0"
                value="${esc(st.w)}" onchange="setVal(PLAN[S.day].ex.find(e=>e.id==='${ex.id}'),${i},'w',this.value)">
              <button class="stepbtn" onclick="stepW('${ex.id}',${i},2.5)">+</button>`;
        }
        h+=`</div><div class="field">
            <button class="stepbtn" onclick="stepR('${ex.id}',${i},-1)">−</button>
            <input class="numin ${st.r!==""?"set":""} ${low?"low":""}" inputmode="numeric" placeholder="${ex.lo}"
              value="${esc(st.r)}" onchange="setVal(PLAN[S.day].ex.find(e=>e.id==='${ex.id}'),${i},'r',this.value)">
            <button class="stepbtn" onclick="stepR('${ex.id}',${i},1)">+</button>
          </div>
          <button class="checkbtn ${st.d?"on":""}" onclick="toggleDone(PLAN[S.day].ex.find(e=>e.id==='${ex.id}'),${i})">✓</button>
        </div>`;
      });

      h+=`<div class="rowtools">`;
      if(!ex.t&&ex.eq!=="bw") h+=`<button class="tool" onclick="copyDown(PLAN[S.day].ex.find(e=>e.id==='${ex.id}'))">copiar peso a todas</button>`;
      h+=`<a class="tool link" target="_blank" rel="noopener"
           href="https://www.youtube.com/results?search_query=${encodeURIComponent(ex.v)}">▶ ver técnica</a>`;
      h+=`</div></div>`;
    }
    h+=`</div>`;
  });
  h+=`</div>`;

  /* notes button */
  const nt=S.notes[sk(S.cycle,S.day)];
  h+=`<div style="padding:4px 12px 14px">
    <button class="sbtn" style="margin:0" onclick="openSheet('notes')">
      ${nt?"📝 VER NOTA DE LA SESIÓN":"📝 AGREGAR NOTA"}</button></div>`;

  document.getElementById("app").innerHTML=h;

  /* fixed layers */
  let fx=document.getElementById("fixed");
  if(!fx){fx=document.createElement("div");fx.id="fixed";document.body.appendChild(fx);}
  let f="";

  if(timer.on){
    const neg=timer.left<0,v=Math.abs(timer.left);
    f+=`<div class="timer"><div class="timerin">
      <div><div class="tlabel">DESCANSO</div>
        <div id="tclock" class="tclock ${neg?"over":""}">${neg?"+":""}${Math.floor(v/60)}:${String(v%60).padStart(2,"0")}</div></div>
      <div class="tbtns">
        <button class="tbtn" onclick="addTimer(30)">+30s</button>
        <button class="tbtn" onclick="stopTimer()">LISTO</button>
      </div></div></div>`;
  }

  f+=`<footer><div class="footin">
    <button class="bigbtn ${s.done?"done":""}" onclick="markSession()">
      ${s.done?"✓ SESIÓN CERRADA":"CERRAR SESIÓN"}</button>
    <div class="foothint ${saveState==="err"?"err":""}">
      ${saveState==="err"?"no se está guardando — exportá tus datos"
        :"se guarda solo en este dispositivo"}</div>
  </div></footer>`;

  if(sheet==="menu"){
    f+=`<div class="backdrop" onclick="if(event.target===this)closeSheet()"><div class="sheet">
      <h2>OPCIONES</h2>
      <p>Los datos viven en este navegador. Exportalos de vez en cuando y guardalos en una nota — es tu red de seguridad.</p>
      <button class="sbtn primary" onclick="exportData()">COPIAR MIS DATOS</button>
      <textarea id="expbox" placeholder="si el copiado falla, el texto aparece acá"></textarea>
      <div class="lbl">PEGAR DATOS PARA RESTAURAR</div>
      <textarea id="impbox" placeholder='{"cycle":1,"data":{...}}'></textarea>
      <button class="sbtn" onclick="importData()">RESTAURAR</button>
      <button class="sbtn" onclick="closeSheet()">CERRAR</button>
    </div></div>`;
  }
  if(sheet==="notes"){
    f+=`<div class="backdrop" onclick="if(event.target===this)closeSheet()"><div class="sheet">
      <h2>NOTA · ${PLAN[S.day].name} · CICLO ${S.cycle}</h2>
      <p>Cómo te sentiste, molestias, cambios de máquina, lo que quieras recordar el próximo ciclo.</p>
      <textarea id="notesbox" class="notesin" style="height:120px"
        placeholder="Ej: la barra del banco parecía más liviana que la del rack">${esc(nt||"")}</textarea>
      <button class="sbtn primary" style="margin-top:12px" onclick="closeSheet()">GUARDAR Y CERRAR</button>
    </div></div>`;
  }

  fx.innerHTML=f;
}

function stepW(id,i,d){
  const ex=PLAN[S.day].ex.find(e=>e.id===id);
  const arr=sets(S.cycle,S.day,ex);
  const cur=parseFloat(arr[i].w)||0;
  arr[i].w=fmt(Math.max(0,cur+d)); save(); render();
}
function stepR(id,i,d){
  const ex=PLAN[S.day].ex.find(e=>e.id===id);
  const arr=sets(S.cycle,S.day,ex);
  const cur=parseInt(arr[i].r)||0;
  arr[i].r=Math.max(0,cur+d); save(); render();
}

/* ═══════════════════ INIT ═══════════════════ */
load(); render();

if("serviceWorker" in navigator){
  window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
window.addEventListener("beforeunload",save);
document.addEventListener("visibilitychange",()=>{if(document.hidden)save();});
</script>
</body>
</html>
