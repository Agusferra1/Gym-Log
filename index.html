<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Gym Log</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#08080A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gym Log">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    /* superficies */
    --bg:#08080A; --surface:#111114; --surface2:#18181D; --surface3:#1F1F26;
    --line:#2A2A32; --edge:#383842;
    /* texto — todo legible, nada por debajo de #7C7A86 (contraste ≥ 4,5:1) */
    --text:#F6F4F2; --sub:#B4B2BC; --muted:#918F9C; --faint:#7C7A86;
    /* brasa */
    --hot:#FF9A3D; --mid:#FF5A2C; --deep:#D8202B; --core:#FF6B35;
    --grad:linear-gradient(135deg,#FF9A3D 0%,#FF5A2C 48%,#D8202B 100%);
    --grad-soft:linear-gradient(135deg,rgba(255,154,61,.16),rgba(216,32,43,.16));
    --warn:#FF4D6A;
    --safe-b:env(safe-area-inset-bottom,0px);
    --safe-t:env(safe-area-inset-top,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:'Inter',system-ui,sans-serif;overscroll-behavior-y:none}
  body{padding-bottom:calc(100px + var(--safe-b))}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,textarea{font-family:'DM Mono',monospace}
  .wrap{max-width:520px;margin:0 auto}
  .grad-txt{background:var(--grad);-webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;color:var(--core)}

  /* ── HEADER ── */
  header{position:sticky;top:0;z-index:40;background:#0C0C0F;
    border-bottom:1px solid var(--line);padding-top:var(--safe-t)}
  .hrow{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px}
  .logo{font-family:'Bebas Neue',sans-serif;font-size:27px;letter-spacing:.2em}
  .hright{display:flex;align-items:center;gap:10px}
  .status{font-family:'DM Mono',monospace;font-size:9.5px;letter-spacing:.1em;color:var(--faint)}
  .status.err{color:var(--warn)}
  .iconbtn{width:35px;height:35px;border:1px solid var(--edge);border-radius:10px;
    display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--sub)}
  .iconbtn:active{background:var(--surface2)}

  .cyclebar{display:flex;align-items:center;justify-content:space-between;padding:0 16px 13px}
  .cyclenum{text-align:center;line-height:1}
  .cyclenum b{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:.16em}
  .cyclenum span{display:block;font-family:'DM Mono',monospace;font-size:9px;
    letter-spacing:.08em;color:var(--faint);margin-top:4px}

  .tabs{display:flex;gap:6px;padding:0 12px}
  .tab{position:relative;flex:1;padding:12px 4px 10px;border:1px solid var(--line);
    border-radius:12px 12px 0 0;font-family:'DM Mono',monospace;color:var(--muted);
    transition:color .15s,border-color .15s,background .15s;overflow:hidden}
  .tab .lbl{font-size:12px;font-weight:500;letter-spacing:.04em}
  .tab .st{font-size:9px;margin-top:4px;height:11px;line-height:11px}
  .tab.has{color:var(--sub);border-color:#3A2418}
  .tab.done{color:var(--core);border-color:#4A2418;background:rgba(255,107,53,.05)}
  .tab.sel{color:var(--text);border-color:var(--mid);background:rgba(255,90,44,.08)}
  .tab.sel::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--grad)}

  /* ── DAY HEAD + RING ── */
  .dayhead{display:flex;align-items:center;gap:16px;padding:20px 16px 18px;
    border-bottom:1px solid var(--line)}
  .dayinfo{flex:1;min-width:0}
  .dayinfo h1{font-family:'Bebas Neue',sans-serif;font-size:35px;letter-spacing:.05em;
    margin:0;line-height:1}
  .dayinfo p{font-family:'DM Mono',monospace;font-size:10.5px;color:var(--sub);
    margin:6px 0 0;letter-spacing:.03em}
  .chip{display:inline-block;margin-top:11px;padding:5px 11px;border-radius:20px;
    font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.05em;
    background:var(--grad-soft);border:1px solid rgba(255,90,44,.25);color:var(--hot)}
  .chip.grey{background:var(--surface2);border-color:var(--line);color:var(--muted)}
  .ringwrap{position:relative;width:92px;height:92px;flex-shrink:0}
  .ringtxt{position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;line-height:1}
  .ringpct{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:.02em}
  .ringsub{font-family:'DM Mono',monospace;font-size:8px;color:var(--muted);
    letter-spacing:.08em;margin-top:3px}

  /* ── VOLUME STRIP ── */
  .vol{display:flex;gap:9px;padding:14px 16px 4px}
  .volcard{flex:1;background:var(--surface);border:1px solid var(--line);
    border-radius:12px;padding:11px 12px}
  .volcard .k{font-family:'DM Mono',monospace;font-size:8.5px;letter-spacing:.09em;
    color:var(--faint)}
  .volcard .v{font-family:'Bebas Neue',sans-serif;font-size:23px;letter-spacing:.04em;
    margin-top:4px;line-height:1}
  .volcard .d{font-family:'DM Mono',monospace;font-size:9px;margin-top:3px}
  .up{color:#4ADE80} .dn{color:var(--warn)} .flat{color:var(--muted)}

  /* ── EXERCISE CARD ── */
  .list{padding:12px 12px 0}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;
    margin-bottom:9px;overflow:hidden;transition:border-color .15s}
  .card.open{border-color:var(--edge)}
  .card.full{border-color:rgba(255,90,44,.35)}
  .chead{width:100%;display:flex;align-items:center;justify-content:space-between;
    padding:15px;text-align:left;gap:10px}
  .cname{font-size:14px;font-weight:600;color:var(--sub);line-height:1.3}
  .card.touched .cname,.card.full .cname{color:var(--text)}
  .swapnote{font-family:'DM Mono',monospace;font-size:10px;color:var(--hot);margin-top:4px;letter-spacing:.02em}
  .cmeta{font-family:'DM Mono',monospace;font-size:9.5px;color:var(--faint);
    margin-top:5px;letter-spacing:.04em}
  .cright{display:flex;align-items:center;gap:10px;flex-shrink:0}
  .cnt{font-family:'DM Mono',monospace;font-size:10.5px;color:var(--core);font-weight:500}
  .sug-i{font-size:12px;font-weight:700}
  .sug-i.up{color:var(--hot)} .sug-i.eq{color:var(--muted)} .sug-i.dn{color:#C9A227}
  .plus{color:var(--muted);font-size:18px;line-height:1;width:14px;text-align:center}

  .cbody{padding:0 13px 15px;border-top:1px solid var(--line)}
  .hint{margin:13px 0 0;font-family:'DM Mono',monospace;font-size:10px;
    color:var(--muted);letter-spacing:.02em;font-style:italic}
  .sugbox{margin:11px 0 13px;padding:10px 12px;border-radius:10px;
    font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.02em;line-height:1.45}
  .sugbox.up{background:var(--grad-soft);border:1px solid rgba(255,90,44,.3);color:var(--hot)}
  .sugbox.eq{background:var(--surface2);border:1px solid var(--line);color:var(--sub)}
  .sugbox.dn{background:var(--surface2);border:1px solid #3A3220;color:#D4AF37}
  .sugbox.none{background:var(--surface2);border:1px solid var(--line);color:var(--muted)}

  /* ── HISTORY CHART ── */
  .hist{margin:0 0 14px;background:var(--surface2);border:1px solid var(--line);
    border-radius:11px;padding:12px}
  .histhead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:11px}
  .histhead .t{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.09em;color:var(--muted)}
  .histhead .n{font-family:'DM Mono',monospace;font-size:9.5px}
  .bars{display:flex;align-items:flex-end;gap:6px;height:56px}
  .bcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%}
  .btrack{flex:1;width:100%;display:flex;align-items:flex-end}
  .bfill{width:100%;border-radius:4px 4px 2px 2px;min-height:3px;background:var(--grad);opacity:.55}
  .bcol.now .bfill{opacity:1}
  .bcol.empty .bfill{background:var(--surface3);opacity:1}
  .blbl{font-family:'DM Mono',monospace;font-size:8px;color:var(--faint);letter-spacing:.04em}
  .bcol.now .blbl{color:var(--core)}
  .bval{font-family:'DM Mono',monospace;font-size:8.5px;color:var(--sub)}

  /* ── SET ROWS ── */
  .colhead{display:flex;gap:7px;padding:0 3px;margin-bottom:8px;
    font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.09em;color:var(--faint)}
  .colhead .c1{width:26px} .colhead .c2,.colhead .c3{flex:1;text-align:center}
  .colhead .c4{width:42px}

  .srow{display:flex;gap:7px;align-items:center;margin-bottom:6px;
    padding:8px 5px;border-radius:10px;background:var(--surface2);
    transition:background .15s,box-shadow .15s}
  .srow.done{background:rgba(255,90,44,.09);box-shadow:inset 2px 0 0 var(--mid)}
  .snum{width:26px;text-align:center;font-family:'DM Mono',monospace;
    font-size:11.5px;color:var(--muted);font-weight:500}
  .srow.done .snum{color:var(--core)}
  .field{flex:1;display:flex;align-items:center;gap:3px;justify-content:center}
  .stepbtn{width:31px;height:36px;border-radius:9px;border:1px solid var(--edge);
    color:var(--sub);font-size:18px;display:flex;align-items:center;justify-content:center}
  .stepbtn:active{background:var(--surface3);color:var(--text)}
  .numin{width:56px;height:36px;background:transparent;border:1px solid transparent;
    border-radius:8px;color:var(--faint);font-size:16px;font-weight:500;text-align:center;
    outline:none;padding:0}
  .numin::placeholder{color:var(--faint);opacity:1}
  .numin.set{color:var(--text)}
  .numin:focus{border-color:var(--mid);background:rgba(255,90,44,.07);color:var(--text)}
  .numin.low{color:#D4AF37}
  .checkbtn{width:42px;height:36px;border-radius:9px;border:1px solid var(--edge);
    display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--muted)}
  .checkbtn.on{background:var(--grad);border-color:transparent;color:#12060A;font-weight:700}

  .rowtools{display:flex;gap:7px;margin-top:10px;flex-wrap:wrap}
  .tool{border:1px solid var(--line);border-radius:20px;padding:7px 13px;
    font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.04em;color:var(--sub)}
  .tool:active{background:var(--surface2);color:var(--text)}
  .tool.link{color:#6BA8E8;border-color:#1E2C3E;text-decoration:none;display:inline-block}

  .tool.swap{color:var(--hot);border-color:rgba(255,90,44,.45);background:rgba(255,90,44,.06);font-weight:500}
  .sugde{color:var(--muted)}
  /* hoja "cambiar ejercicio" */
  .opt{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);border-radius:12px;
    margin-bottom:8px;background:var(--surface2)}
  .opt.sel{border-color:var(--mid);background:rgba(255,90,44,.08)}
  .oinfo{flex:1;min-width:0}
  .opt .on{font-size:14px;font-weight:600;line-height:1.3}
  .om{font-family:'DM Mono',monospace;font-size:10px;color:var(--muted);margin-top:4px;letter-spacing:.03em;line-height:1.4}
  .om .orig{color:var(--hot)}
  .obtns{display:flex;flex-direction:column;gap:6px;flex-shrink:0}
  .mini{font-family:'DM Mono',monospace;font-size:10.5px;color:#6BA8E8;border:1px solid #1E2C3E;border-radius:16px;
    padding:0 11px;min-height:36px;text-decoration:none;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center}
  .pick{font-family:'DM Mono',monospace;font-size:10.5px;padding:0 12px;min-height:36px;border-radius:16px;
    background:var(--grad);color:#140609;font-weight:500;display:inline-flex;align-items:center;justify-content:center}
  .pick.cur{background:var(--surface3);color:var(--sub)}
  .addform{margin-top:14px;padding:12px;border:1px dashed var(--edge);border-radius:12px}
  .txtin{width:100%;height:42px;background:var(--bg);border:1px solid var(--line);border-radius:9px;color:var(--text);
    padding:0 10px;font-family:'Inter',sans-serif;font-size:14px;margin-bottom:8px;outline:none}
  .txtin:focus{border-color:var(--mid)}
  .txtin::placeholder{color:var(--faint)}
  .eqs{display:flex;gap:6px;flex-wrap:wrap}
  .eqb{font-family:'DM Mono',monospace;font-size:10px;padding:0 10px;min-height:36px;border:1px solid var(--edge);
    border-radius:14px;color:var(--sub)}
  .eqb.s{border-color:var(--mid);color:var(--hot);background:rgba(255,90,44,.08)}

  /* ── FOOTER ── */
  footer{position:fixed;bottom:0;left:0;right:0;z-index:40;
    padding:10px 12px calc(14px + var(--safe-b));
    background:linear-gradient(0deg,var(--bg) 62%,transparent)}
  .footin{max-width:520px;margin:0 auto}
  .bigbtn{width:100%;padding:17px;border-radius:14px;background:var(--grad);color:#140609;
    font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:.2em}
  .bigbtn.done{background:var(--surface2);color:var(--core);border:1px solid rgba(255,90,44,.4)}
  .bigbtn:active{transform:scale(.985)}
  .foothint{text-align:center;margin-top:8px;font-family:'DM Mono',monospace;
    font-size:9px;letter-spacing:.05em;color:var(--faint)}
  .foothint.err{color:var(--warn)}

  /* ── TIMER ── */
  .timer{position:fixed;left:0;right:0;bottom:calc(92px + var(--safe-b));z-index:45;
    padding:0 12px;pointer-events:none}
  .timerin{max-width:520px;margin:0 auto;background:#1A0D0A;
    border:1px solid rgba(255,90,44,.4);border-radius:14px;
    padding:12px 15px;display:flex;align-items:center;gap:12px;pointer-events:auto;
    box-shadow:0 8px 34px rgba(0,0,0,.72)}
  .tlabel{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.13em;color:var(--muted)}
  .tclock{font-family:'Bebas Neue',sans-serif;font-size:32px;letter-spacing:.05em;
    line-height:1;margin-top:3px}
  .tclock.over{color:var(--warn);-webkit-text-fill-color:var(--warn)}
  .tbtns{margin-left:auto;display:flex;gap:7px}
  .tbtn{padding:9px 13px;border-radius:9px;border:1px solid rgba(255,90,44,.35);
    font-family:'DM Mono',monospace;font-size:10.5px;color:var(--hot);letter-spacing:.04em}
  .tbtn:active{background:rgba(255,90,44,.16)}

  /* ── SHEET ── */
  .backdrop{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:60;
    display:flex;align-items:flex-end;justify-content:center}
  .sheet{width:100%;max-width:520px;background:var(--surface);
    border:1px solid var(--line);border-radius:20px 20px 0 0;
    padding:22px 18px calc(24px + var(--safe-b));max-height:88vh;overflow-y:auto}
  .sheet h2{font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:.1em;margin:0 0 6px}
  .sheet p{font-family:'DM Mono',monospace;font-size:11px;color:var(--sub);
    line-height:1.7;margin:0 0 16px}
  .sbtn{width:100%;padding:14px;border-radius:11px;margin-bottom:9px;
    font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.08em;
    border:1px solid var(--edge);color:var(--text);text-align:center}
  .sbtn:active{background:var(--surface2)}
  .sbtn.primary{background:var(--grad);color:#140609;border-color:transparent;font-weight:500}
  textarea{width:100%;height:88px;background:var(--bg);border:1px solid var(--line);
    color:var(--text);padding:11px;border-radius:10px;font-size:10px;resize:vertical;
    outline:none;margin-bottom:9px}
  textarea::placeholder{color:var(--faint)}
  textarea:focus{border-color:var(--mid)}
  .lbl{font-family:'DM Mono',monospace;font-size:9.5px;color:var(--muted);
    letter-spacing:.08em;margin:16px 0 8px}
  .notesin{font-family:'Inter',sans-serif;font-size:12px;height:110px}

  /* stats sheet */
  .strow{display:flex;justify-content:space-between;align-items:center;
    padding:12px 2px;border-bottom:1px solid var(--line)}
  .strow:last-child{border-bottom:none}
  .stk{font-family:'DM Mono',monospace;font-size:11px;color:var(--sub)}
  .stv{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:.04em}

  .toast{position:fixed;left:50%;transform:translateX(-50%);z-index:80;
    top:calc(14px + var(--safe-t));background:var(--grad);color:#140609;
    padding:11px 21px;border-radius:24px;font-family:'DM Mono',monospace;
    font-size:11px;letter-spacing:.04em;white-space:nowrap;
    box-shadow:0 4px 28px rgba(255,90,44,.35);font-weight:500}
  .toast.err{background:var(--warn);color:#fff}

  .banner{background:var(--warn);color:#1A0006;padding:11px 14px;
    display:flex;align-items:center;justify-content:space-between;gap:10px}
  .banner b{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.04em;display:block}
  .banner span{font-family:'DM Mono',monospace;font-size:9px;opacity:.8}
  .banner button{background:#1A0006;color:var(--warn);padding:8px 13px;border-radius:8px;
    font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.04em;font-weight:600}

  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <linearGradient id="ember" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9A3D"/>
      <stop offset="48%" stop-color="#FF5A2C"/>
      <stop offset="100%" stop-color="#D8202B"/>
    </linearGradient>
  </defs>
</svg>
<div id="app" class="wrap"></div>

<script src="rutina.js"></script>
<script src="datos.js"></script>
<script src="app.js"></script>
</body>
</html>
