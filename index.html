<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Gym Log</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#08080A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gym Log">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    /* superficies */
    --bg:#08080A; --surface:#111114; --surface2:#18181D; --surface3:#1F1F26;
    --line:#2A2A32; --edge:#383842;
    /* texto — todo legible, nada por debajo de #6E6E7A */
    --text:#F6F4F2; --sub:#B4B2BC; --muted:#918F9C; --faint:#7C7A86;
    /* brasa */
    --hot:#FF9A3D; --mid:#FF5A2C; --deep:#D8202B; --core:#FF6B35;
    --grad:linear-gradient(135deg,#FF9A3D 0%,#FF5A2C 48%,#D8202B 100%);
    --grad-soft:linear-gradient(135deg,rgba(255,154,61,.16),rgba(216,32,43,.16));
    --warn:#FF4D6A;
    --safe-b:env(safe-area-inset-bottom,0px);
    --safe-t:env(safe-area-inset-top,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:'Inter',system-ui,sans-serif;overscroll-behavior-y:none}
  body{padding-bottom:calc(100px + var(--safe-b))}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,textarea{font-family:'DM Mono',monospace}
  .wrap{max-width:520px;margin:0 auto}
  .grad-txt{background:var(--grad);-webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;color:var(--core)}

  /* ── HEADER ── */
  header{position:sticky;top:0;z-index:40;background:#0C0C0F;
    border-bottom:1px solid var(--line);padding-top:var(--safe-t)}
  .hrow{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px}
  .logo{font-family:'Bebas Neue',sans-serif;font-size:27px;letter-spacing:.2em}
  .hright{display:flex;align-items:center;gap:10px}
  .status{font-family:'DM Mono',monospace;font-size:9.5px;letter-spacing:.1em;color:var(--faint)}
  .status.err{color:var(--warn)}
  .iconbtn{width:35px;height:35px;border:1px solid var(--edge);border-radius:10px;
    display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--sub)}
  .iconbtn:active{background:var(--surface2)}

  .cyclebar{display:flex;align-items:center;justify-content:space-between;padding:0 16px 13px}
  .cyclenum{text-align:center;line-height:1}
  .cyclenum b{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:.16em}
  .cyclenum span{display:block;font-family:'DM Mono',monospace;font-size:9px;
    letter-spacing:.08em;color:var(--faint);margin-top:4px}

  .tabs{display:flex;gap:6px;padding:0 12px}
  .tab{position:relative;flex:1;padding:12px 4px 10px;border:1px solid var(--line);
    border-radius:12px 12px 0 0;font-family:'DM Mono',monospace;color:var(--muted);
    transition:color .15s,border-color .15s,background .15s;overflow:hidden}
  .tab .lbl{font-size:12px;font-weight:500;letter-spacing:.04em}
  .tab .st{font-size:9px;margin-top:4px;height:11px;line-height:11px}
  .tab.has{color:var(--sub);border-color:#3A2418}
  .tab.done{color:var(--core);border-color:#4A2418;background:rgba(255,107,53,.05)}
  .tab.sel{color:var(--text);border-color:var(--mid);background:rgba(255,90,44,.08)}
  .tab.sel::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--grad)}

  /* ── DAY HEAD + RING ── */
  .dayhead{display:flex;align-items:center;gap:16px;padding:20px 16px 18px;
    border-bottom:1px solid var(--line)}
  .dayinfo{flex:1;min-width:0}
  .dayinfo h1{font-family:'Bebas Neue',sans-serif;font-size:35px;letter-spacing:.05em;
    margin:0;line-height:1}
  .dayinfo p{font-family:'DM Mono',monospace;font-size:10.5px;color:var(--sub);
    margin:6px 0 0;letter-spacing:.03em}
  .chip{display:inline-block;margin-top:11px;padding:5px 11px;border-radius:20px;
    font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.05em;
    background:var(--grad-soft);border:1px solid rgba(255,90,44,.25);color:var(--hot)}
  .chip.grey{background:var(--surface2);border-color:var(--line);color:var(--muted)}
  .ringwrap{position:relative;width:92px;height:92px;flex-shrink:0}
  .ringtxt{position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;line-height:1}
  .ringpct{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:.02em}
  .ringsub{font-family:'DM Mono',monospace;font-size:8px;color:var(--muted);
    letter-spacing:.08em;margin-top:3px}

  /* ── VOLUME STRIP ── */
  .vol{display:flex;gap:9px;padding:14px 16px 4px}
  .volcard{flex:1;background:var(--surface);border:1px solid var(--line);
    border-radius:12px;padding:11px 12px}
  .volcard .k{font-family:'DM Mono',monospace;font-size:8.5px;letter-spacing:.09em;
    color:var(--faint)}
  .volcard .v{font-family:'Bebas Neue',sans-serif;font-size:23px;letter-spacing:.04em;
    margin-top:4px;line-height:1}
  .volcard .d{font-family:'DM Mono',monospace;font-size:9px;margin-top:3px}
  .up{color:#4ADE80} .dn{color:var(--warn)} .flat{color:var(--muted)}

  /* ── EXERCISE CARD ── */
  .list{padding:12px 12px 0}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;
    margin-bottom:9px;overflow:hidden;transition:border-color .15s}
  .card.open{border-color:var(--edge)}
  .card.full{border-color:rgba(255,90,44,.35)}
  .chead{width:100%;display:flex;align-items:center;justify-content:space-between;
    padding:15px;text-align:left;gap:10px}
  .cname{font-size:14px;font-weight:600;color:var(--sub);line-height:1.3}
  .card.touched .cname,.card.full .cname{color:var(--text)}
  .cmeta{font-family:'DM Mono',monospace;font-size:9.5px;color:var(--faint);
    margin-top:5px;letter-spacing:.04em}
  .cright{display:flex;align-items:center;gap:10px;flex-shrink:0}
  .cnt{font-family:'DM Mono',monospace;font-size:10.5px;color:var(--core);font-weight:500}
  .sug-i{font-size:12px;font-weight:700}
  .sug-i.up{color:var(--hot)} .sug-i.eq{color:var(--muted)} .sug-i.dn{color:#C9A227}
  .plus{color:var(--muted);font-size:18px;line-height:1;width:14px;text-align:center}

  .cbody{padding:0 13px 15px;border-top:1px solid var(--line)}
  .hint{margin:13px 0 0;font-family:'DM Mono',monospace;font-size:10px;
    color:var(--muted);letter-spacing:.02em;font-style:italic}
  .sugbox{margin:11px 0 13px;padding:10px 12px;border-radius:10px;
    font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.02em;line-height:1.45}
  .sugbox.up{background:var(--grad-soft);border:1px solid rgba(255,90,44,.3);color:var(--hot)}
  .sugbox.eq{background:var(--surface2);border:1px solid var(--line);color:var(--sub)}
  .sugbox.dn{background:var(--surface2);border:1px solid #3A3220;color:#D4AF37}
  .sugbox.none{background:var(--surface2);border:1px solid var(--line);color:var(--muted)}

  /* ── HISTORY CHART ── */
  .hist{margin:0 0 14px;background:var(--surface2);border:1px solid var(--line);
    border-radius:11px;padding:12px}
  .histhead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:11px}
  .histhead .t{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.09em;color:var(--muted)}
  .histhead .n{font-family:'DM Mono',monospace;font-size:9.5px}
  .bars{display:flex;align-items:flex-end;gap:6px;height:56px}
  .bcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%}
  .btrack{flex:1;width:100%;display:flex;align-items:flex-end}
  .bfill{width:100%;border-radius:4px 4px 2px 2px;min-height:3px;background:var(--grad);opacity:.55}
  .bcol.now .bfill{opacity:1}
  .bcol.empty .bfill{background:var(--surface3);opacity:1}
  .blbl{font-family:'DM Mono',monospace;font-size:8px;color:var(--faint);letter-spacing:.04em}
  .bcol.now .blbl{color:var(--core)}
  .bval{font-family:'DM Mono',monospace;font-size:8.5px;color:var(--sub)}

  /* ── SET ROWS ── */
  .colhead{display:flex;gap:7px;padding:0 3px;margin-bottom:8px;
    font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.09em;color:var(--faint)}
  .colhead .c1{width:26px} .colhead .c2,.colhead .c3{flex:1;text-align:center}
  .colhead .c4{width:42px}

  .srow{display:flex;gap:7px;align-items:center;margin-bottom:6px;
    padding:8px 5px;border-radius:10px;background:var(--surface2);
    transition:background .15s,box-shadow .15s}
  .srow.done{background:rgba(255,90,44,.09);box-shadow:inset 2px 0 0 var(--mid)}
  .snum{width:26px;text-align:center;font-family:'DM Mono',monospace;
    font-size:11.5px;color:var(--muted);font-weight:500}
  .srow.done .snum{color:var(--core)}
  .field{flex:1;display:flex;align-items:center;gap:3px;justify-content:center}
  .stepbtn{width:31px;height:36px;border-radius:9px;border:1px solid var(--edge);
    color:var(--sub);font-size:18px;display:flex;align-items:center;justify-content:center}
  .stepbtn:active{background:var(--surface3);color:var(--text)}
  .numin{width:56px;height:36px;background:transparent;border:1px solid transparent;
    border-radius:8px;color:var(--faint);font-size:16px;font-weight:500;text-align:center;
    outline:none;padding:0}
  .numin::placeholder{color:var(--faint);opacity:1}
  .numin.set{color:var(--text)}
  .numin:focus{border-color:var(--mid);background:rgba(255,90,44,.07);color:var(--text)}
  .numin.low{color:#D4AF37}
  .checkbtn{width:42px;height:36px;border-radius:9px;border:1px solid var(--edge);
    display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--muted)}
  .checkbtn.on{background:var(--grad);border-color:transparent;color:#12060A;font-weight:700}

  .rowtools{display:flex;gap:7px;margin-top:10px;flex-wrap:wrap}
  .tool{border:1px solid var(--line);border-radius:20px;padding:7px 13px;
    font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.04em;color:var(--sub)}
  .tool:active{background:var(--surface2);color:var(--text)}
  .tool.link{color:#6BA8E8;border-color:#1E2C3E;text-decoration:none;display:inline-block}

  /* ── FOOTER ── */
  footer{position:fixed;bottom:0;left:0;right:0;z-index:40;
    padding:10px 12px calc(14px + var(--safe-b));
    background:linear-gradient(0deg,var(--bg) 62%,transparent)}
  .footin{max-width:520px;margin:0 auto}
  .bigbtn{width:100%;padding:17px;border-radius:14px;background:var(--grad);color:#140609;
    font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:.2em}
  .bigbtn.done{background:var(--surface2);color:var(--core);border:1px solid rgba(255,90,44,.4)}
  .bigbtn:active{transform:scale(.985)}
  .foothint{text-align:center;margin-top:8px;font-family:'DM Mono',monospace;
    font-size:9px;letter-spacing:.05em;color:var(--faint)}
  .foothint.err{color:var(--warn)}

  /* ── TIMER ── */
  .timer{position:fixed;left:0;right:0;bottom:calc(92px + var(--safe-b));z-index:45;
    padding:0 12px;pointer-events:none}
  .timerin{max-width:520px;margin:0 auto;background:#1A0D0A;
    border:1px solid rgba(255,90,44,.4);border-radius:14px;
    padding:12px 15px;display:flex;align-items:center;gap:12px;pointer-events:auto;
    box-shadow:0 8px 34px rgba(0,0,0,.72)}
  .tlabel{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.13em;color:var(--muted)}
  .tclock{font-family:'Bebas Neue',sans-serif;font-size:32px;letter-spacing:.05em;
    line-height:1;margin-top:3px}
  .tclock.over{color:var(--warn);-webkit-text-fill-color:var(--warn)}
  .tbtns{margin-left:auto;display:flex;gap:7px}
  .tbtn{padding:9px 13px;border-radius:9px;border:1px solid rgba(255,90,44,.35);
    font-family:'DM Mono',monospace;font-size:10.5px;color:var(--hot);letter-spacing:.04em}
  .tbtn:active{background:rgba(255,90,44,.16)}

  /* ── SHEET ── */
  .backdrop{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:60;
    display:flex;align-items:flex-end;justify-content:center}
  .sheet{width:100%;max-width:520px;background:var(--surface);
    border:1px solid var(--line);border-radius:20px 20px 0 0;
    padding:22px 18px calc(24px + var(--safe-b));max-height:88vh;overflow-y:auto}
  .sheet h2{font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:.1em;margin:0 0 6px}
  .sheet p{font-family:'DM Mono',monospace;font-size:11px;color:var(--sub);
    line-height:1.7;margin:0 0 16px}
  .sbtn{width:100%;padding:14px;border-radius:11px;margin-bottom:9px;
    font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.08em;
    border:1px solid var(--edge);color:var(--text);text-align:center}
  .sbtn:active{background:var(--surface2)}
  .sbtn.primary{background:var(--grad);color:#140609;border-color:transparent;font-weight:500}
  textarea{width:100%;height:88px;background:var(--bg);border:1px solid var(--line);
    color:var(--text);padding:11px;border-radius:10px;font-size:10px;resize:vertical;
    outline:none;margin-bottom:9px}
  textarea::placeholder{color:var(--faint)}
  textarea:focus{border-color:var(--mid)}
  .lbl{font-family:'DM Mono',monospace;font-size:9.5px;color:var(--muted);
    letter-spacing:.08em;margin:16px 0 8px}
  .notesin{font-family:'Inter',sans-serif;font-size:12px;height:110px}

  /* stats sheet */
  .strow{display:flex;justify-content:space-between;align-items:center;
    padding:12px 2px;border-bottom:1px solid var(--line)}
  .strow:last-child{border-bottom:none}
  .stk{font-family:'DM Mono',monospace;font-size:11px;color:var(--sub)}
  .stv{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:.04em}

  .toast{position:fixed;left:50%;transform:translateX(-50%);z-index:80;
    top:calc(14px + var(--safe-t));background:var(--grad);color:#140609;
    padding:11px 21px;border-radius:24px;font-family:'DM Mono',monospace;
    font-size:11px;letter-spacing:.04em;white-space:nowrap;
    box-shadow:0 4px 28px rgba(255,90,44,.35);font-weight:500}
  .toast.err{background:var(--warn);color:#fff}

  .banner{background:var(--warn);color:#1A0006;padding:11px 14px;
    display:flex;align-items:center;justify-content:space-between;gap:10px}
  .banner b{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.04em;display:block}
  .banner span{font-family:'DM Mono',monospace;font-size:9px;opacity:.8}
  .banner button{background:#1A0006;color:var(--warn);padding:8px 13px;border-radius:8px;
    font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.04em;font-weight:600}

  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <linearGradient id="ember" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9A3D"/>
      <stop offset="48%" stop-color="#FF5A2C"/>
      <stop offset="100%" stop-color="#D8202B"/>
    </linearGradient>
  </defs>
</svg>
<div id="app" class="wrap"></div>

<script>
/* ═══════════ PLAN · 3 días full body ═══════════ */
const PLAN=[
 {k:"1",name:"DÍA 1",sub:"Full body · énfasis empuje",
  ex:[
   {id:"a1",n:"Press banca con barra",s:3,lo:8,hi:10,eq:"side",v:"press banca con barra tecnica correcta"},
   {id:"a2",n:"Remo con mancuerna un brazo",s:3,lo:10,hi:12,eq:"db",v:"remo con mancuerna un brazo tecnica"},
   {id:"a3",n:"Sentadilla goblet",s:3,lo:10,hi:12,eq:"db",v:"sentadilla goblet tecnica"},
   {id:"a4",n:"Press militar mancuernas",s:3,lo:10,hi:12,eq:"db",v:"press militar con mancuernas sentado"},
   {id:"a5",n:"Extensión tríceps en polea",s:3,lo:12,hi:15,eq:"stack",v:"extension triceps polea cuerda"},
   {id:"a6",n:"Curl bíceps con barra",s:3,lo:10,hi:12,eq:"side",v:"curl de biceps con barra"},
   {id:"a7",n:"Plancha frontal",s:3,lo:45,hi:45,eq:"bw",t:1,v:"plancha frontal abdomen tecnica"}
  ]},
 {k:"2",name:"DÍA 2",sub:"Full body · énfasis tirón",
  ex:[
   {id:"b1",n:"Peso muerto rumano (RDL)",s:3,lo:10,hi:12,eq:"side",v:"peso muerto rumano RDL tecnica"},
   {id:"b2",n:"Jalón al pecho",s:3,lo:10,hi:12,eq:"stack",v:"jalon al pecho agarre ancho tecnica"},
   {id:"b3",n:"Press inclinado mancuernas",s:3,lo:10,hi:12,eq:"db",v:"press inclinado con mancuernas"},
   {id:"b4",n:"Prensa de piernas",s:3,lo:12,hi:15,eq:"side",v:"prensa de piernas 45 grados"},
   {id:"b5",n:"Elevaciones laterales",s:3,lo:12,hi:15,eq:"db",v:"elevaciones laterales con mancuernas"},
   {id:"b6",n:"Curl martillo",s:3,lo:10,hi:12,eq:"db",v:"curl martillo con mancuernas"},
   {id:"b7",n:"Elevación de piernas colgado",s:3,lo:10,hi:15,eq:"bw",v:"elevacion de piernas colgado"}
  ]},
 {k:"3",name:"DÍA 3",sub:"Full body · énfasis piernas",
  ex:[
   {id:"c1",n:"Sentadilla libre",s:3,lo:8,hi:10,eq:"side",v:"sentadilla libre con barra tecnica"},
   {id:"c2",n:"Remo en polea baja",s:3,lo:10,hi:12,eq:"stack",v:"remo en polea baja sentado"},
   {id:"c3",n:"Fondos en paralelas",s:3,lo:8,hi:12,eq:"bw",v:"fondos en paralelas dips tecnica"},
   {id:"c4",n:"Curl femoral acostado",s:3,lo:12,hi:15,eq:"stack",v:"curl femoral acostado maquina"},
   {id:"c5",n:"Face pull con cuerda",s:3,lo:15,hi:20,eq:"stack",v:"face pull con cuerda polea"},
   {id:"c6",n:"Curl concentrado",s:3,lo:10,hi:12,eq:"db",v:"curl concentrado con mancuerna"},
   {id:"c7",n:"Rueda abdominal",s:3,lo:10,hi:15,eq:"bw",v:"rueda abdominal ab wheel"}
  ]}
];

const EQ={
 side :{lbl:"KG / LADO",  hint:"Anotá el peso de UN lado de la barra"},
 db   :{lbl:"KG / MANC.", hint:"Anotá el peso de UNA mancuerna"},
 stack:{lbl:"KG",         hint:"Anotá el peso que marca el stack"},
 bw   :{lbl:"KG EXTRA",   hint:"0 si es solo tu peso corporal"}
};

const KEY="gymlog.v3";   /* misma clave: no perdés lo ya cargado */
const REST=90;

let S={cycle:1,day:0,data:{},notes:{}};
let openEx=null, saveState="ok", toastT=null, sheet=null;
let timer={on:false,left:0,id:null};

const blank=ex=>Array.from({length:ex.s},()=>({w:"",r:"",d:false}));
const sk=(c,d)=>"c"+c+"d"+PLAN[d].k;
const fmt=n=>(Math.round(n*10)/10).toString().replace(/\.0$/,"");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ═══════════ PERSISTENCIA ═══════════ */
function migrate(){
  /* v3 guardaba los días como A/B/C; ahora son 1/2/3 */
  const map={A:"1",B:"2",C:"3"};
  let moved=0;
  Object.keys(S.data).forEach(k=>{
    const m=k.match(/^c(\d+)d([ABC])$/);
    if(!m) return;
    const nk="c"+m[1]+"d"+map[m[2]];
    if(!S.data[nk]) S.data[nk]=S.data[k];
    delete S.data[k]; moved++;
  });
  Object.keys(S.notes).forEach(k=>{
    const m=k.match(/^c(\d+)d([ABC])$/);
    if(!m) return;
    const nk="c"+m[1]+"d"+map[m[2]];
    if(!S.notes[nk]) S.notes[nk]=S.notes[k];
    delete S.notes[k];
  });
  if(moved) save();
}
function load(){
  try{
    const raw=localStorage.getItem(KEY);
    if(raw){const p=JSON.parse(raw);
      S.cycle=p.cycle||1; S.data=p.data||{}; S.notes=p.notes||{};}
    saveState="ok";
    migrate();
  }catch(e){saveState="err";console.error(e);}
}
function save(){
  try{
    localStorage.setItem(KEY,JSON.stringify({cycle:S.cycle,data:S.data,notes:S.notes,v:4}));
    saveState="ok";
  }catch(e){saveState="err";console.error(e);render();}
}
function sess(c,d){const k=sk(c,d); if(!S.data[k])S.data[k]={ex:{},done:false}; return S.data[k];}
function sets(c,d,ex){
  const s=sess(c,d);
  if(!s.ex[ex.id]||s.ex[ex.id].length!==ex.s) s.ex[ex.id]=blank(ex);
  return s.ex[ex.id];
}

/* ═══════════ MÉTRICAS ═══════════ */
function sessionVolume(c,d){
  const s=S.data[sk(c,d)]; if(!s) return 0;
  let v=0;
  PLAN[d].ex.forEach(ex=>{
    if(ex.t) return;                      /* los de tiempo no suman volumen */
    (s.ex[ex.id]||[]).forEach(x=>{
      const w=parseFloat(x.w)||0, r=parseInt(x.r)||0;
      v += w*r;
    });
  });
  return Math.round(v);
}
function cycleVolume(c){return [0,1,2].reduce((a,d)=>a+sessionVolume(c,d),0);}
function exTopWeight(c,d,exId){
  const s=S.data[sk(c,d)]; if(!s||!s.ex[exId]) return 0;
  return s.ex[exId].reduce((m,x)=>Math.max(m,parseFloat(x.w)||0),0);
}
function exHistory(ex){
  /* últimos 6 ciclos hasta el actual */
  const from=Math.max(1,S.cycle-5), out=[];
  for(let c=from;c<=S.cycle;c++) out.push({c, w:exTopWeight(c,S.day,ex.id)});
  return out;
}

/* ═══════════ SUGERENCIA ═══════════ */
function suggest(ex,si){
  if(S.cycle<2) return null;
  const prev=S.data[sk(S.cycle-1,S.day)];
  if(!prev||!prev.ex[ex.id]) return null;
  const p=prev.ex[ex.id][si];
  if(!p||p.r===""||p.r==null) return null;
  const w=parseFloat(p.w)||0, r=parseInt(p.r)||0;
  if(r>=ex.hi) return {t:"up",w:w+2.5,txt:"Subí a "+fmt(w+2.5)+" kg — llegaste al tope"};
  if(r>=ex.lo) return {t:"eq",w:w,txt:"Mantené "+fmt(w)+" kg — sumá reps"};
  return {t:"dn",w:w,txt:"Mantené "+fmt(w)+" kg — recuperá el rango"};
}
function exSuggest(ex){
  const all=[]; for(let i=0;i<ex.s;i++){const s=suggest(ex,i); if(s)all.push(s);}
  if(!all.length) return null;
  if(all.some(s=>s.t==="up")) return "up";
  if(all.every(s=>s.t==="dn")) return "dn";
  return "eq";
}

/* ═══════════ TIMER ═══════════ */
function startTimer(){
  clearInterval(timer.id); timer.on=true; timer.left=REST;
  timer.id=setInterval(()=>{
    timer.left--;
    if(timer.left===0&&navigator.vibrate) navigator.vibrate([180,90,180]);
    if(timer.left<=-30) stopTimer(); else paintTimer();
  },1000);
  render();
}
function stopTimer(){clearInterval(timer.id);timer.on=false;render();}
function addTimer(s){timer.left+=s;paintTimer();}
function paintTimer(){
  const el=document.getElementById("tclock"); if(!el)return;
  const neg=timer.left<0,v=Math.abs(timer.left);
  el.textContent=(neg?"+":"")+Math.floor(v/60)+":"+String(v%60).padStart(2,"0");
  el.className="tclock"+(neg?" over":" grad-txt");
}

/* ═══════════ ACCIONES ═══════════ */
function setVal(exId,si,f,v){
  const ex=PLAN[S.day].ex.find(e=>e.id===exId);
  sets(S.cycle,S.day,ex)[si][f]=v; save(); render();
}
function stepW(id,i,d){
  const ex=PLAN[S.day].ex.find(e=>e.id===id), a=sets(S.cycle,S.day,ex);
  a[i].w=fmt(Math.max(0,(parseFloat(a[i].w)||0)+d)); save(); render();
}
function stepR(id,i,d){
  const ex=PLAN[S.day].ex.find(e=>e.id===id), a=sets(S.cycle,S.day,ex);
  a[i].r=Math.max(0,(parseInt(a[i].r)||0)+d); save(); render();
}
function toggleDone(id,si){
  const ex=PLAN[S.day].ex.find(e=>e.id===id), a=sets(S.cycle,S.day,ex);
  const was=a[si].d; a[si].d=!was;
  if(!was){
    if(a[si].r==="") a[si].r=ex.lo;
    if(a[si].w===""&&ex.eq!=="bw"&&!ex.t){const s=suggest(ex,si); if(s)a[si].w=fmt(s.w);}
  }
  save();
  if(!was) startTimer(); else render();
}
function copyDown(id){
  const ex=PLAN[S.day].ex.find(e=>e.id===id), a=sets(S.cycle,S.day,ex);
  const w=a[0].w; a.forEach(x=>x.w=w); save(); render();
}
function markSession(){
  const s=sess(S.cycle,S.day); s.done=!s.done; save(); render();
  toast(s.done?"Sesión cerrada":"Sesión reabierta");
}
function exportData(){
  const txt=JSON.stringify({cycle:S.cycle,data:S.data,notes:S.notes,v:4});
  navigator.clipboard.writeText(txt)
    .then(()=>toast("Copiado — pegalo en una nota"))
    .catch(()=>{const t=document.getElementById("expbox"); if(t){t.value=txt;t.select();toast("Copialo a mano");}});
}
function importData(){
  const t=document.getElementById("impbox");
  if(!t||!t.value.trim()){toast("Pegá los datos primero",1);return;}
  try{
    const p=JSON.parse(t.value);
    if(!p.data) throw 0;
    S.cycle=p.cycle||1; S.data=p.data; S.notes=p.notes||{};
    save(); sheet=null; render(); toast("Datos importados");
  }catch(e){toast("El texto no es válido",1);}
}
function toast(m,err){
  clearTimeout(toastT);
  let t=document.getElementById("toast");
  if(!t){t=document.createElement("div");t.id="toast";document.body.appendChild(t);}
  t.className="toast"+(err?" err":""); t.textContent=m;
  toastT=setTimeout(()=>t.remove(),2200);
}
function closeSheet(){
  if(sheet==="notes"){
    const n=document.getElementById("notesbox");
    if(n){S.notes[sk(S.cycle,S.day)]=n.value;save();}
  }
  sheet=null;render();
}

/* ═══════════ RENDER ═══════════ */
function ring(pct){
  const R=40,C=2*Math.PI*R,off=C*(1-pct/100);
  return `<svg width="92" height="92" viewBox="0 0 92 92">
    <circle cx="46" cy="46" r="${R}" fill="none" stroke="#1F1F26" stroke-width="7"/>
    <circle cx="46" cy="46" r="${R}" fill="none" stroke="url(#ember)" stroke-width="7"
      stroke-linecap="round" stroke-dasharray="${C.toFixed(1)}"
      stroke-dashoffset="${off.toFixed(1)}"
      transform="rotate(-90 46 46)" style="transition:stroke-dashoffset .45s ease"/>
  </svg>`;
}

function render(){
  const day=PLAN[S.day], s=sess(S.cycle,S.day);
  let total=0,filled=0;
  day.ex.forEach(ex=>{const a=sets(S.cycle,S.day,ex);total+=ex.s;a.forEach(x=>{if(x.d)filled++;});});
  const pct=total?Math.round(filled/total*100):0;

  const volNow=sessionVolume(S.cycle,S.day);
  const volPrev=sessionVolume(S.cycle-1,S.day);
  const volDelta=volPrev>0?Math.round((volNow-volPrev)/volPrev*100):null;

  let h="";

  if(saveState==="err"){
    h+=`<div class="banner">
      <div><b>No se puede guardar</b><span>revisá modo incógnito o espacio del navegador</span></div>
      <button onclick="save();render()">Reintentar</button></div>`;
  }

  h+=`<header>
    <div class="hrow">
      <div class="logo grad-txt">GYM LOG</div>
      <div class="hright">
        <span class="status ${saveState==="err"?"err":""}">${saveState==="err"?"● SIN GUARDAR":"✓ GUARDADO"}</span>
        <button class="iconbtn" onclick="sheet='stats';render()">📊</button>
        <button class="iconbtn" onclick="sheet='menu';render()">⋯</button>
      </div>
    </div>
    <div class="cyclebar">
      <button class="iconbtn" onclick="if(S.cycle>1){S.cycle--;openEx=null;save();render()}">←</button>
      <div class="cyclenum"><b class="grad-txt">CICLO ${S.cycle}</b><span>3 SESIONES POR CICLO</span></div>
      <button class="iconbtn" onclick="S.cycle++;openEx=null;save();render()">→</button>
    </div>
    <div class="tabs">`;
  PLAN.forEach((d,i)=>{
    const ds=S.data[sk(S.cycle,i)];
    const done=ds&&ds.done;
    const has=ds&&Object.values(ds.ex||{}).some(a=>a.some(x=>x.d));
    h+=`<button class="tab ${(S.day===i?"sel ":"")+(done?"done":has?"has":"")}"
      onclick="S.day=${i};openEx=null;render()">
      <div class="lbl">DÍA ${d.k}</div>
      <div class="st">${done?"✓":has?"•":"&nbsp;"}</div></button>`;
  });
  h+=`</div></header>`;

  /* day head + ring */
  h+=`<div class="dayhead">
    <div class="dayinfo">
      <h1>${day.name}</h1>
      <p>${esc(day.sub)}</p>
      ${s.done?`<span class="chip">✓ SESIÓN CERRADA</span>`:
        S.cycle>1?`<span class="chip">SUGERENCIAS ACTIVAS</span>`:
        `<span class="chip grey">PRIMER CICLO · FIJANDO TU BASE</span>`}
    </div>
    <div class="ringwrap">${ring(pct)}
      <div class="ringtxt"><div class="ringpct grad-txt">${pct}%</div>
        <div class="ringsub">${filled}/${total} SERIES</div></div>
    </div>
  </div>`;

  /* volumen */
  h+=`<div class="vol">
    <div class="volcard">
      <div class="k">VOLUMEN DE HOY</div>
      <div class="v grad-txt">${volNow.toLocaleString("es-AR")}</div>
      <div class="d ${volDelta==null?"flat":volDelta>0?"up":volDelta<0?"dn":"flat"}">
        ${volDelta==null?"sin comparación aún":(volDelta>0?"▲ +":volDelta<0?"▼ ":"= ")+Math.abs(volDelta)+"% vs ciclo "+(S.cycle-1)}
      </div>
    </div>
    <div class="volcard">
      <div class="k">VOLUMEN DEL CICLO</div>
      <div class="v">${cycleVolume(S.cycle).toLocaleString("es-AR")}</div>
      <div class="d flat">kg × reps acumulados</div>
    </div>
  </div>`;

  /* ejercicios */
  h+=`<div class="list">`;
  day.ex.forEach(ex=>{
    const a=sets(S.cycle,S.day,ex);
    const nd=a.filter(x=>x.d).length;
    const isOpen=openEx===ex.id;
    const eq=EQ[ex.eq];
    const si=exSuggest(ex);
    const unit=ex.t?"seg":"reps";
    const range=ex.lo===ex.hi?`${ex.s}×${ex.lo} ${unit}`:`${ex.s}×${ex.lo}–${ex.hi} ${unit}`;

    h+=`<div class="card ${(isOpen?"open ":"")+(nd===ex.s?"full ":nd>0?"touched ":"")}">
      <button class="chead" onclick="openEx=${isOpen?"null":"'"+ex.id+"'"};render()">
        <div style="flex:1;min-width:0">
          <div class="cname">${esc(ex.n)}</div>
          <div class="cmeta">${range} · ${ex.t?"PESO CORPORAL":eq.lbl}</div>
        </div>
        <div class="cright">
          ${nd>0?`<span class="cnt">${nd}/${ex.s}</span>`:""}
          ${si&&nd===0?`<span class="sug-i ${si}">${si==="up"?"↑":si==="dn"?"↺":"="}</span>`:""}
          <span class="plus">${isOpen?"−":"+"}</span>
        </div>
      </button>`;

    if(isOpen){
      h+=`<div class="cbody">`;
      h+=`<div class="hint">↳ ${ex.t?"Aguantá el tiempo objetivo con buena forma":eq.hint}</div>`;

      const s0=suggest(ex,0);
      h+=s0
        ?`<div class="sugbox ${s0.t}">${s0.t==="up"?"↑":s0.t==="dn"?"↺":"="} ${esc(s0.txt)}</div>`
        :`<div class="sugbox none">Sin datos del ciclo anterior — anotá tu referencia</div>`;

      /* historial */
      if(!ex.t){
        const hist=exHistory(ex);
        const max=Math.max(...hist.map(x=>x.w),1);
        const withData=hist.filter(x=>x.w>0);
        if(withData.length>0){
          const first=withData[0].w, last=withData[withData.length-1].w;
          const dif=last-first;
          h+=`<div class="hist">
            <div class="histhead">
              <span class="t">HISTORIAL · PESO MÁXIMO</span>
              <span class="n ${dif>0?"up":dif<0?"dn":"flat"}">
                ${withData.length<2?"primer registro":(dif>0?"▲ +"+fmt(dif):dif<0?"▼ "+fmt(dif):"= sin cambio")+" kg"}</span>
            </div>
            <div class="bars">`;
          hist.forEach(x=>{
            const hp=x.w>0?Math.max(8,Math.round(x.w/max*100)):4;
            h+=`<div class="bcol ${x.c===S.cycle?"now":""} ${x.w>0?"":"empty"}">
              <span class="bval">${x.w>0?fmt(x.w):"—"}</span>
              <div class="btrack"><div class="bfill" style="height:${hp}%"></div></div>
              <span class="blbl">C${x.c}</span>
            </div>`;
          });
          h+=`</div></div>`;
        }
      }

      h+=`<div class="colhead">
        <span class="c1">SET</span>
        <span class="c2">${ex.t?"—":eq.lbl}</span>
        <span class="c3">${unit.toUpperCase()}</span>
        <span class="c4"></span></div>`;

      a.forEach((st,i)=>{
        const rv=parseInt(st.r)||0, low=rv>0&&rv<ex.lo;
        h+=`<div class="srow ${st.d?"done":""}">
          <span class="snum">${i+1}</span>
          <div class="field">`;
        h+= ex.t
          ? `<span style="font-family:'DM Mono',monospace;font-size:13px;color:var(--faint)">—</span>`
          : `<button class="stepbtn" onclick="stepW('${ex.id}',${i},-2.5)">−</button>
             <input class="numin ${st.w!==""?"set":""}" inputmode="decimal" placeholder="0"
               value="${esc(st.w)}" onchange="setVal('${ex.id}',${i},'w',this.value)">
             <button class="stepbtn" onclick="stepW('${ex.id}',${i},2.5)">+</button>`;
        h+=`</div><div class="field">
            <button class="stepbtn" onclick="stepR('${ex.id}',${i},-1)">−</button>
            <input class="numin ${st.r!==""?"set":""} ${low?"low":""}" inputmode="numeric"
              placeholder="${ex.lo}" value="${esc(st.r)}"
              onchange="setVal('${ex.id}',${i},'r',this.value)">
            <button class="stepbtn" onclick="stepR('${ex.id}',${i},1)">+</button>
          </div>
          <button class="checkbtn ${st.d?"on":""}" onclick="toggleDone('${ex.id}',${i})">✓</button>
        </div>`;
      });

      h+=`<div class="rowtools">`;
      if(!ex.t&&ex.eq!=="bw") h+=`<button class="tool" onclick="copyDown('${ex.id}')">copiar peso a todas</button>`;
      h+=`<a class="tool link" target="_blank" rel="noopener"
        href="https://www.youtube.com/results?search_query=${encodeURIComponent(ex.v)}">▶ ver técnica</a>`;
      h+=`</div></div>`;
    }
    h+=`</div>`;
  });
  h+=`</div>`;

  const nt=S.notes[sk(S.cycle,S.day)];
  h+=`<div style="padding:4px 12px 14px">
    <button class="sbtn" style="margin:0" onclick="sheet='notes';render()">
      ${nt?"📝 VER NOTA DE LA SESIÓN":"📝 AGREGAR NOTA"}</button></div>`;

  document.getElementById("app").innerHTML=h;

  /* capas fijas */
  let fx=document.getElementById("fixed");
  if(!fx){fx=document.createElement("div");fx.id="fixed";document.body.appendChild(fx);}
  let f="";

  if(timer.on){
    const neg=timer.left<0,v=Math.abs(timer.left);
    f+=`<div class="timer"><div class="timerin">
      <div><div class="tlabel">DESCANSO</div>
        <div id="tclock" class="tclock ${neg?"over":"grad-txt"}">${neg?"+":""}${Math.floor(v/60)}:${String(v%60).padStart(2,"0")}</div></div>
      <div class="tbtns">
        <button class="tbtn" onclick="addTimer(30)">+30s</button>
        <button class="tbtn" onclick="stopTimer()">LISTO</button>
      </div></div></div>`;
  }

  f+=`<footer><div class="footin">
    <button class="bigbtn ${s.done?"done":""}" onclick="markSession()">
      ${s.done?"✓ SESIÓN CERRADA":"CERRAR SESIÓN"}</button>
    <div class="foothint ${saveState==="err"?"err":""}">
      ${saveState==="err"?"no se está guardando — exportá tus datos":"se guarda solo en este dispositivo"}</div>
  </div></footer>`;

  if(sheet==="menu"){
    f+=`<div class="backdrop" onclick="if(event.target===this)closeSheet()"><div class="sheet">
      <h2 class="grad-txt">OPCIONES</h2>
      <p>Tus datos viven en este navegador. Exportalos cada tanto y guardalos en una nota — es tu red de seguridad.</p>
      <button class="sbtn primary" onclick="exportData()">COPIAR MIS DATOS</button>
      <textarea id="expbox" placeholder="si el copiado falla, el texto aparece acá"></textarea>
      <div class="lbl">PEGAR DATOS PARA RESTAURAR</div>
      <textarea id="impbox" placeholder='{"cycle":1,"data":{...}}'></textarea>
      <button class="sbtn" onclick="importData()">RESTAURAR</button>
      <button class="sbtn" onclick="closeSheet()">CERRAR</button>
    </div></div>`;
  }

  if(sheet==="stats"){
    const rows=[];
    for(let c=Math.max(1,S.cycle-5);c<=S.cycle;c++){
      const v=cycleVolume(c);
      const doneN=[0,1,2].filter(d=>S.data[sk(c,d)]&&S.data[sk(c,d)].done).length;
      rows.push({c,v,doneN});
    }
    const best=Math.max(...rows.map(r=>r.v),1);
    f+=`<div class="backdrop" onclick="if(event.target===this)closeSheet()"><div class="sheet">
      <h2 class="grad-txt">TU PROGRESO</h2>
      <p>Volumen = peso × repeticiones sumado. Sirve para comparar ciclos entre sí, no como kilos absolutos levantados.</p>
      <div class="bars" style="height:80px;margin-bottom:18px">`;
    rows.forEach(r=>{
      const hp=r.v>0?Math.max(6,Math.round(r.v/best*100)):3;
      f+=`<div class="bcol ${r.c===S.cycle?"now":""} ${r.v>0?"":"empty"}">
        <span class="bval">${r.v>0?(r.v/1000).toFixed(1)+"k":"—"}</span>
        <div class="btrack"><div class="bfill" style="height:${hp}%"></div></div>
        <span class="blbl">C${r.c}</span></div>`;
    });
    f+=`</div>`;
    rows.slice().reverse().forEach(r=>{
      f+=`<div class="strow">
        <span class="stk">Ciclo ${r.c} · ${r.doneN}/3 sesiones cerradas</span>
        <span class="stv ${r.c===S.cycle?"grad-txt":""}">${r.v.toLocaleString("es-AR")}</span>
      </div>`;
    });
    f+=`<button class="sbtn" style="margin-top:16px" onclick="closeSheet()">CERRAR</button>
    </div></div>`;
  }

  if(sheet==="notes"){
    f+=`<div class="backdrop" onclick="if(event.target===this)closeSheet()"><div class="sheet">
      <h2 class="grad-txt">NOTA · ${PLAN[S.day].name} · CICLO ${S.cycle}</h2>
      <p>Cómo te sentiste, molestias, cambios de máquina, lo que quieras recordar el próximo ciclo.</p>
      <textarea id="notesbox" class="notesin"
        placeholder="Ej: la barra del banco parecía más liviana que la del rack">${esc(nt||"")}</textarea>
      <button class="sbtn primary" style="margin-top:12px" onclick="closeSheet()">GUARDAR Y CERRAR</button>
    </div></div>`;
  }

  fx.innerHTML=f;
}

/* ═══════════ INIT ═══════════ */
load(); render();
if("serviceWorker" in navigator){
  window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
window.addEventListener("beforeunload",save);
document.addEventListener("visibilitychange",()=>{if(document.hidden)save();});
</script>
</body>
</html>
